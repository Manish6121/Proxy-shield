<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProxyShield — Reports & Security Stream</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-logo">PS</div>
        <div>
          <h1 style="font-size: 1.3rem; color: var(--emerald);">Audit Reports & Export</h1>
          <p style="font-size: 0.85rem; color: var(--muted);">Real-Time Security Violation Log</p>
        </div>
      </div>
      <div class="user-meta">
        <button class="btn-outline" onclick="window.location.href='console.html'">← Back to Console</button>
        <button class="btn-outline" onclick="logout()">Logout</button>
      </div>
    </header>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;">
        <h3>Security Breach Logs</h3>
        <button class="btn btn-emerald" style="width: auto; margin-top: 0;" onclick="window.location.href='/api/reports/csv'">📥 Download CSV Ledger</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Incident ID</th>
            <th>Time</th>
            <th>Student</th>
            <th>Violation Type</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="auditTable">
          <tr><td colspan="5" style="text-align:center; color: var(--muted);">Loading breach records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="../../js/auth.js"></script>
  <script src="../../js/faculty.js"></script>
</body>
</html>
